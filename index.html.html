<script>
const SL=[['p55','Jugadores 5v5','PLAYERS 5V5'],['p54','Jugadores 5v4 PP','PLAYERS 5V4 PP'],['hh','Partidos H to H (opcional)','H to H'],['un','Unidades PP y porteros (formato ancho, opcional)','H to H + UND PP 1 - 2'],['t55','Equipos 5v5 SVA','TEAM 5V5 SVA'],['t54','Equipos 5v4 (power play)','TEAM STAT 5V4'],['t45','Equipos 4v5 (penal killing)','TEAM STAT 4V5'],['g55','Porteros 5v5 SVA','PORTEROS 5V5 SVA'],['g45','Porteros 4v5','PORTEROS 4V5'],['h55','Histórico 5v5 (opcional)','5V5 2025-2026'],['h54','Histórico 5v4 (opcional)','5v4 2025-2026']];
const NM={"anaheim ducks":"ANA","boston bruins":"BOS","buffalo sabres":"BUF","calgary flames":"CGY","carolina hurricanes":"CAR","chicago blackhawks":"CHI","colorado avalanche":"COL","columbus blue jackets":"CBJ","dallas stars":"DAL","detroit red wings":"DET","edmonton oilers":"EDM","florida panthers":"FLA","los angeles kings":"LA","minnesota wild":"MIN","montreal canadiens":"MTL","nashville predators":"NSH","new jersey devils":"NJ","new york islanders":"NYI","new york rangers":"NYR","ottawa senators":"OTT","philadelphia flyers":"PHI","pittsburgh penguins":"PIT","san jose sharks":"SJ","seattle kraken":"SEA","st louis blues":"STL","tampa bay lightning":"TB","toronto maple leafs":"TOR","utah mammoth":"UTA","utah hockey club":"UTA","vancouver canucks":"VAN","vegas golden knights":"VGK","washington capitals":"WSH","winnipeg jets":"WPG"};
const AB=new Set(Object.values(NM));
const cl=(x,a,b)=>Math.min(b,Math.max(a,x)),n=v=>{const x=parseFloat(v);return isNaN(x)?0:x},mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;

const st={g:k=>{try{return localStorage.getItem('nhl4_'+k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem('nhl4_'+k,v)}catch(e){}}};
function csv(t){const R=[];let r=[],f='',q=false;t=t.replace(/^\uFEFF/,'');const h1=t.split(/\r?\n/)[0],dl=(h1.match(/;/g)||[]).length>(h1.match(/,/g)||[]).length?';':',';for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==dl){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);R.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);R.push(r)}return R.filter(x=>x.some(v=>v.trim()!==''))}
function tbl(t){const R=csv(t),h=R[0].map(x=>x.trim());return R.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]==null?'':r[i]).trim());return o})}
function plist(rows){const m={};for(const r of rows){if(!r.Player)continue;const pos=(r.Position||'').trim(),k=N(r.Player)+'|'+pos;const o={name:r.Player.trim(),pos,g:pos=='D'?'D':'F',team:ab(r.Team),gp:n(r.GP),toi:n(r.TOI),tgp:n(r['TOI/GP']),G:n(r['Goals/60']),A1:n(r['First Assists/60']),A2:n(r['Second Assists/60']),m:[n(r['Shots/60']),n(r['ixG/60']),n(r['iSCF/60']),n(r['iHDCF/60'])]};if(!m[k]||o.toi>m[k].toi)m[k]=o}return m}
function units(t){const G={},O=[];for(const r of csv(t).slice(1)){const v=r.map(x=>(x||'').trim()),[pt,eq,tp,c,lw]=v;const a=ab(eq);if(!a)continue;if(!G[pt]){G[pt]=[];O.push(pt)}let T=G[pt].find(x=>x.ab==a);if(!T){T={ab:a,PP1:[],PP2:[],gk:'',gs:''};G[pt].push(T)}if(/^portero/i.test(tp)){T.gk=c;T.gs=lw}else if(/^PP[12]$/i.test(tp)){const L=/^power play/i.test(c)?v.slice(5,10):v.slice(3,8);T[tp.toUpperCase()]=L.filter(x=>x&&x!='-')}}return O.map(k=>G[k]).filter(g=>g.length>1)}
const TG=/\s+(IR-LT|LTIR|IR|DTD|OUT)$/i;
const pn=raw=>{const m=raw.match(TG);return{tag:m?m[1].toUpperCase():'',nm:raw.replace(TG,'').trim()}};
function mt(nm,p){const t=N(nm).split(' '),q=N(p.name).split(' ');return t[t.length-1]==q[q.length-1]&&(t[0].length>1?t[0]==q[0]:t[0][0]==q[0][0])}
function gavg(m){const a={F:{T:0,G:0,A1:0,A2:0,tg:0,m:[0,0,0,0]},D:{T:0,G:0,A1:0,A2:0,tg:0,m:[0,0,0,0]}};for(const p of Object.values(m)){const x=a[p.g],w=p.toi;x.T+=w;x.G+=p.G*w;x.A1+=p.A1*w;x.A2+=p.A2*w;x.tg+=p.tgp*w;p.m.forEach((v,i)=>x.m[i]+=v*w)}for(const g of['F','D']){const x=a[g],T=x.T||1;x.G/=T;x.A1/=T;x.A2/=T;x.tgp=x.tg/T;x.m=x.m.map(v=>v/T)}return a}
// Modelo por situación: índice de tiro (regresado, con prior histórico al 60%) + goles + A1 regresada + A2 por rol
function sit(cur,hist,s,rm){const W=s=='55'?[.5,.1,.3,.1]:[.2,.25,.3,.25],KI=s=='55'?200:90,KG=s=='55'?1000:250,KA={F:s=='55'?1150:164,D:s=='55'?700:1000};const ac=gavg(cur),ah=hist?gavg(hist):null,o={};

for(const k in cur){const p=cur[k],h=hist&&hist[k],v=ac[p.g],Th=h?.6*h.toi:0,Ic=ix(p,v),Ih=h?ix(h,ah[h.g]):1,ia=(p.toi*Ic+Th*Ih+KI)/(p.toi+Th+KI);const wt=p.gp/(p.gp+10),tb=h&&h.tgp?wt*p.tgp+(1-wt)*h.tgp:p.tgp,r=rm(k,p,v,tb),T=p.toi+Th;
const g=(p.toi*p.G+Th*(h?h.G:0)+KG*v.G*ia)/(T+KG),a1=(p.toi*p.A1+Th*(h?h.A1:0)+KA[p.g]*v.A1*r)/(T+KA[p.g]);o[k]={g,a:a1+v.A2*r,t:tb,h:!!h}}return o}
function tidx(rows,K,gm){const M=['xGA/60','HDCA/60','SCA/60','SA/60','GA/60'],W=[.35,.15,.15,.15,.2],mu=M.map(c=>mean(rows.map(r=>n(r[c])))),o={};for(const r of rows){const a=ab(r.Team);if(!a)continue;const raw=M.reduce((s,c,i)=>s+W[i]*(mu[i]?n(r[c])/mu[i]:1),0),b=gm?n(r.GP):n(r.GP)*n(r['TOI/GP']),w=b/(b+K);o[a]={i:w*raw+1-w,gp:n(r.GP)}}return o}
function gmap(rows){const o={};for(const r of rows||[]){const a=ab(r.Team);if(!a)continue;(o[a]=o[a]||[]).push({nm:N(r.Player).split(' '),toi:n(r.TOI),gs:n(r['GSAA/60'])})}return o}
function gfind(M,a,raw){const x=M[a];if(!x||!raw)return null;const t=N(raw.replace(/\(.*\)/,'')).split(' ');return x.filter(g=>g.nm[g.nm.length-1]==t[t.length-1]&&(t[0].length>1?g.nm[0]==t[0]:g.nm[0][0]==t[0][0])).sort((p,q)=>q.toi-p.toi)[0]||null}
const gf=(g,K,lg)=>g?cl(1-g.toi/(g.toi+K)*g.gs/lg,.9,1.1):1;
const D={},P={};let tab='dash';const C={n:40,sk:'p1',sd:-1,f:{},team:'',rev:false,q:''};
const RK={Alta:3,Media:2,Baja:1};
const CD=[{k:'name',l:'Jugador',t:'t'},{k:'T',l:'Eq.',t:'t'},{k:'pos',l:'Pos',t:'t'},{k:'o',l:'Rival',t:'t'},{k:'u',l:'PP',t:'t'},{k:'L',l:'Pts esp.'},{k:'p1',l:'P(≥1 pt)',m:100},{k:'p2',l:'P(≥2)',m:100},{k:'q',l:'Cuota justa',f:r=>r.p1,nf:1},{k:'g',l:'Goles | Asist.'},{k:'c5',l:'5v5'},{k:'c4',l:'5v4'},{k:'t5',l:'TOI 5v5'},{k:'t4',l:'TOI 5v4'},{k:'d',l:'Def rival',m:100},{k:'k',l:'PK rival',m:100},{k:'gs',l:'Portero GSAA'},{k:'conf',l:'Conf.',t:'t',sg:r=>RK[r.conf]},{k:'av',l:'Aviso',t:'t'}];
function cv(r,c,so){if(so&&c.sg)return c.sg(r);const v=c.f?c.f(r):r[c.k];if(c.t=='t')return N(v);return v==null?null:v*(c.m||1)}
function fok(r,c){const s=(C.f[c.k]||'').trim().replace(',','.');if(!s||c.nf)return true;const v=cv(r,c);if(c.t=='t')return v.includes(N(s));if(v==null)return false;let m=s.match(/^(>=|<=|>|<|=)?\s*(-?[\d.]+)$/);if(m){const x=+m[2],o=m[1]||'>=';return o=='>='?v>=x:o=='<='?v<=x:o=='>'?v>x:o=='<'?v<x:v==x}m=s.match(/^(-?[\d.]+)\s*-\s*(-?[\d.]+)$/);return m?v>=+m[1]&&v<=+m[2]:true}
function hhgames(rows){const G=[];for(const r of rows){const v=Object.values(r)[0]||'',p=v.split(/\s+vs\.?\s+/i);if(p.length<2)continue;const a=ab(p[0]),b=ab(p[1]);if(!a||!b)continue;G.push([{ab:a,PP1:[],PP2:[],gk:(r['Portero Visitante']||'').trim(),gs:''},{ab:b,PP1:[],PP2:[],gk:(r['Portero Local']||'').trim(),gs:''}])}return G}
function parse(k,t){let rows;if(k=='un')rows=units(t);else if(k=='hh'){rows=hhgames(tbl(t));if(!rows.length)rows=units(t)}else{rows=tbl(t);if(['p55','p54','h55','h54'].includes(k))rows=plist(rows)}P[k]=rows;return Array.isArray(rows)?rows.length:Object.keys(rows).length}
async function rd(f){const b=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1252').decode(b)}}
async function load(k,t){try{const c=parse(k,t);D[k]={n:c};st.s(k,t)}catch(e){delete D[k];delete P[k];alert('No se pudo leer el archivo '+k+': revisa que sea CSV separado por comas con encabezados.')}render()}
function run(){if(!P.p55||!P.p54)return null;const AL=[],GM=(P.hh&&P.hh.length)?P.hh:(P.un||[]);

for(const r of P.t54||[]){const a=ab(r.Team);if(a)ppT[a]=n(r['TOI/GP'])}for(const r of P.t45||[]){const a=ab(r.Team);if(a)pkT[a]=n(r['TOI/GP'])}
const lgPP=mean(Object.values(ppT))||5.2,lgPK=mean(Object.values(pkT))||5.2,lg5=P.t55?mean(P.t55.map(r=>n(r['GA/60']))):2.5,lg4=P.t45?mean(P.t45.map(r=>n(r['GA/60']))):8.2;
const G5=gmap(P.g55),G4=gmap(P.g45),opp={},UT={};
const UU={};(P.un||[]).forEach(g=>g.forEach(t=>UU[t.ab]=t));GM.forEach(g=>{const[v,l]=g;for(const t of g){const u=UU[t.ab];if(u&&t!==u){t.PP1=u.PP1;t.PP2=u.PP2;if(!t.gk)t.gk=u.gk}}opp[v.ab]={o:l.ab,h:0,O:l};opp[l.ab]={o:v.ab,h:1,O:v};UT[v.ab]=v;UT[l.ab]=l});
const ro={};for(const k in P.p55)ro[k]={a:P.p55[k],team:P.p55[k].team};for(const k in P.p54){ro[k]=ro[k]||{team:P.p54[k].team};ro[k].b=P.p54[k]}
const bt={};for(const k in ro)(bt[ro[k].team]=bt[ro[k].team]||[]).push(ro[k].a||ro[k].b);
const UM={};for(const k in ro){const T=UT[ro[k].team],p=ro[k].a||ro[k].b;if(!T)continue;for(const u of['PP1','PP2']){let f=0;for(const raw of T[u]){const{nm,tag}=pn(raw);if(mt(nm,p)){UM[k]={u,tag};f=1;break}}if(f)break}}
const nf=[];for(const a in UT)for(const u of['PP1','PP2'])for(const raw of UT[a][u])if(!(bt[a]||[]).some(p=>mt(pn(raw).nm,p)))nf.push(a+' '+raw);
const m55=sit(P.p55,P.h55,'55',(k,p,v,tb)=>cl(tb/v.tgp,.6,1.7)),m54=sit(P.p54,P.h54,'54',(k,p,v,tb)=>{const u=UM[k]&&UM[k].u;return u=='PP1'?1.25:u=='PP2'?.75:cl(tb/v.tgp,.5,1.5)});
const ex=new Set((st.g('ex')||'').split('\n').map(N).filter(Boolean)),tgp={};for(const k in P.p55){const p=P.p55[k];tgp[p.team]=Math.max(tgp[p.team]||0,p.gp)}
const R=[];let out=0;const gmiss=[];
for(const k in ro){const r=ro[k],T=r.team,O=opp[T]||(GM.length?null:{o:'',h:0,O:{gk:''}});if(!O)continue;const a=r.a,b=r.b,p=a||b,gp=Math.max(a?a.gp:0,b?b.gp:0);if(gp<5)continue;
const ui=UM[k],o=O.o,gk=O.O.gk,g5=gfind(G5,o,gk),g4=gfind(G4,o,gk);if(gk&&!g5&&P.g55&&!gmiss.includes(o+' '+gk))gmiss.push(o+' '+gk);

let t5=0,g5v=0,a5v=0,t4=0,g4v=0,a4v=0,rev=false;
if(m55[k]){const m=m55[k];t5=m.t;const w=t5/60*fd;g5v=w*m.g;a5v=w*m.a}
if(m54[k]){const m=m54[k];if(ppT[T]){let s=m.t/ppT[T];if(ui)s=.5*s+.5*(ui.u=='PP1'?.67:.39);else if(UT[T]&&UT[T].PP1.length){if(s>=.4){rev=true;av.push('REVISAR: rol PP grande y fuera de PP1/PP2')}else s*=.6}t4=s*((ppT[T]+(pkT[o]||lgPK))/2)}else t4=m.t;const w=t4/60*fk;g4v=w*m.g;a4v=w*m.a}
if(ui&&ui.tag=='DTD')av.push('DTD');const tg=tgp[T]||gp;if(gp<.7*tg)av.push('PJ '+gp+' de '+tg+': ¿regreso o lesión?');
const hh=(m55[k]&&m55[k].h)||(m54[k]&&m54[k].h);if(P.h55&&!hh)av.push('Sin histórico');
const L=g5v+a5v+g4v+a4v;if(!(L>0))continue;const p1=1-Math.exp(-L),conf=(hh?1:0)+(gp>=.8*tg?1:0)+(ui?1:0);
R.push({name:p.name,T,pos:p.pos,o,h:O.h,u:ui?ui.u:'',L,p1,p2:1-Math.exp(-L)*(1+L),g:g5v+g4v,a:a5v+a4v,c5:g5v+a5v,c4:g4v+a4v,t5,t4,d:t55[o]?t55[o].i:null,k:t45[o]?t45[o].i:null,gs:g5?g5.gs:null,conf:conf>=3?'Alta':conf==2?'Media':'Baja',rev,av:av.join('; ')})}
if(!P.h55)AL.push('Sin histórico 5v5: se usa prior por rol (menos precisión con pocos partidos).');

function met(){return`<h2>Cómo se calcula</h2><ul><li>Solo 5v5 y 5v4. Pts/60 esperado = goles + A1 regresada + A2 por rol. Los puntos reales nunca son predictor.</li><li>Índice de tiro con Shots 50%, iSCF 30%, ixG 10%, iHDCF 10% en 5v5 (pesos reajustados fuera de muestra con la temporada pasada). Tope 3.0 y regresión a la media.</li><li>Prior histórico (temporada pasada) con 60% de peso por minuto, finishing incluido en goles, K de A1 estimadas entre temporadas.</li><li>5v4: TOI según unidad (PP1 ≈ 67% del tiempo de PP del equipo, PP2 ≈ 39%), minutos de PP = promedio entre PP del equipo y PK del rival.</li><li>Rival: índice defensivo 5v5 y de penal killing (xGA 35%, HDCA 15%, SCA 15%, SA 15%, GA 20%) regresado, más portero rival con GSAA/60 contraído (máx. ±10%).</li><li>Disponibilidad: IR, IR-LT y OUT se excluyen; jugadores con rol grande en 5v4 que no aparecen en las unidades quedan como REVISAR.</li></ul><h2>Limitaciones</h2><ul><li>No incluye localía, back-to-back, calidad del power play propio ni líneas de apuestas.</li><li>Con ~18 partidos goles y asistencias son sobre todo ruido: por eso se regresa a la media.</li><li>La prueba real de acierto exige guardar los pronósticos diarios y compararlos con los puntos reales posteriores.</li></ul>`}

const q=$('#cq');if(q)q.onchange=()=>{C.q=q.value;render()};const x=$('#ex');if(x)x.onchange=()=>{st.s('ex',x.value)};document.querySelectorAll('th[data-s]').forEach(h=>h.onclick=()=>{const k=h.dataset.s;if(C.sk==k)C.sd*=-1;else{C.sk=k;C.sd=CD.find(c=>c.k==k).t=='t'?1:-1}render()});document.querySelectorAll('.fi').forEach(i=>i.onchange=()=>{C.f[i.dataset.f]=i.value;render()});const cx=$('#cx');if(cx)cx.onclick=()=>{C.f={};C.q='';C.team='';render()};document.querySelectorAll('.ti').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value.replace(',','.'));if(!isNaN(v))TK[i.dataset.k]=v;render()})}
